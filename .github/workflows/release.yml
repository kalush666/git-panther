name: Release

# Builds the self-contained Windows installers (NSIS and MSI, each embedding
# the WebView2 offline installer). Every push to main uploads them as
# workflow artifacts; a `v*` tag also attaches them to a draft release.
on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  windows-installers:
    name: Windows installers
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - run: pnpm install --frozen-lockfile
      - name: Closed-network check (no external origins in the UI bundle)
        run: pnpm check:offline

      - name: Build installers
        run: pnpm --filter @git-panther/desktop tauri build

      - name: Verify the installers are self-contained
        run: node scripts/verify-installers.mjs target/release/bundle

      - uses: actions/upload-artifact@v4
        with:
          name: git-panther-windows-installers
          path: |
            target/release/bundle/nsis/*.exe
            target/release/bundle/msi/*.msi
          if-no-files-found: error

      - name: Attach to a draft release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          files: |
            target/release/bundle/nsis/*.exe
            target/release/bundle/msi/*.msi
