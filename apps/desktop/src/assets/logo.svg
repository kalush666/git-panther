<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" role="img" aria-label="Git Panther">
  <defs>
    <clipPath id="gp-badge">
      <rect width="256" height="256" rx="56"/>
    </clipPath>
    <linearGradient id="gp-coat" x1="0.15" y1="0" x2="0.85" y2="1">
      <stop offset="0" stop-color="#A585FA"/>
      <stop offset="0.55" stop-color="#7C4DEB"/>
      <stop offset="1" stop-color="#4A22B0"/>
    </linearGradient>
  </defs>
  <rect width="256" height="256" rx="56" fill="#0B0A10"/>

  <g clip-path="url(#gp-badge)">
    <g transform="translate(-10 -22) scale(1.06)">
      <!-- Silhouette: lunging, roaring panther in profile. The open jaw is negative space. -->
      <path d="M22 262
               Q26 154 70 112
               L78 78
               Q84 64 98 72
               L112 90
               Q142 72 174 82
               L194 96
               Q216 100 228 112
               L234 118
               L234 134
               L229 153
               L164 158
               L220 193
               L216 207
               L186 221
               L138 223
               L124 262 Z"
            fill="url(#gp-coat)"/>

      <!-- Facet cuts in the background colour -->
      <g fill="#0B0A10">
        <!-- inner ear -->
        <path d="M84 98 L88 80 Q92 76 96 82 L102 94 Z"/>
        <!-- heavy brow, angled toward the nose -->
        <path d="M138 98 L200 101 L140 105 Z"/>
        <!-- snarl wrinkles on the muzzle -->
        <path d="M200 116 L218 124 L203 122 Z"/>
        <path d="M204 129 L221 137 L206 135 Z"/>
        <!-- cheek cut from eye toward the jaw -->
        <path d="M126 124 L166 152 L150 158 Z"/>
        <!-- neck muscle -->
        <path d="M48 164 L92 216 L74 218 Z"/>
        <!-- nose pad -->
        <path d="M226 112 L236 118 L234 128 Z"/>
      </g>

      <!-- Eye: slanted almond with slit pupil -->
      <path d="M158 112 Q178 103 200 110 Q178 124 158 112 Z" fill="#F1EAFF"/>
      <path d="M180 106 L183 112 L180 119 L177 112 Z" fill="#0B0A10"/>

      <!-- Fangs -->
      <path d="M225 153 L216 188 L207 156 Z" fill="#F1EAFF"/>
      <path d="M211 192 L203 168 L196 189 Z" fill="#F1EAFF"/>
    </g>
  </g>
</svg>
