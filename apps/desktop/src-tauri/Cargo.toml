[package]
name = "git-panther"
description = "Git Panther desktop app: composition root and IPC adapter."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[lib]
name = "git_panther_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
panther-domain.workspace = true
panther-application.workspace = true
panther-git.workspace = true
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
notify-debouncer-mini = "0.7"
# specta versions are pinned to the exact set tauri-specta was released against.
specta = { version = "=2.0.0-rc.26" }
specta-typescript = "=0.0.13"
tauri-specta = { version = "=2.0.0-rc.26", features = ["derive", "typescript"] }

[dev-dependencies]
cargo_metadata = "0.23"
tempfile = "3"

[lints]
workspace = true
