[package]
name = "panther-git"
description = "Git Panther git adapters (libgit2 and system git CLI) implementing domain ports."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
panther-domain.workspace = true
# Network access goes through the git CLI, so libgit2's HTTPS/SSH support is
# not needed; vendoring avoids depending on a system libgit2.
git2 = { version = "0.21", default-features = false, features = ["vendored-libgit2"] }

[dev-dependencies]
tempfile = "3"

[lints]
workspace = true
